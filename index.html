<title>Pinch Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed physics canvas under a thin HUD bar; hint strip floats at the bottom. One dark "lab bench" look, chosen on purpose. */
:root{
  --ink:#0e1524; --panel:#162036; --line:#2a3754; --text:#e9eef7; --muted:#97a3bd;
  --rope:#e2ad4f; --ball:#ff6a48; --goal:#58d2a6; --hand:#8fd0ff;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--display);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.chip.on{color:var(--ink);background:var(--hand);border-color:var(--hand)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
button{font:inherit;font-weight:700;font-size:14px;color:var(--text);background:transparent;border:0;padding:8px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--hand);outline-offset:2px}
.seg button{padding:8px 11px;font-family:var(--mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.btn{border:1px solid var(--line);border-radius:10px}
.btn.primary{background:var(--hand);color:var(--ink);border-color:var(--hand)}
.stage{position:relative;flex:1;min-height:0}
canvas,video{position:absolute;inset:0;width:100%;height:100%}
video{opacity:0;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:0;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:3px}
.hint b{font-size:16px;font-weight:700;text-wrap:balance}
.hint span{font-size:13px;color:var(--muted);max-width:60ch}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,21,36,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:320px}
.card h2{margin:0;font-size:30px;font-weight:800;color:var(--goal);letter-spacing:-.02em}
.card p{margin:0;color:var(--muted);font-size:14px}
</style>

<div class="app">
  <div class="hud">
    <div class="brand">Pinch Lab <span class="chip" id="mode">Touch</span></div>
    <div class="seg" role="group" aria-label="Level">
      <button id="l0" aria-pressed="true">1</button>
      <button id="l1" aria-pressed="false">2</button>
    </div>
    <button class="btn" id="reset">Reset</button>
    <button class="btn primary" id="cam">Use hand</button>
  </div>
  <div class="stage" id="stage">
    <video id="v" playsinline muted></video>
    <canvas id="c"></canvas>
    <div class="hint"><b id="hintTitle"></b><span id="hintText"></span></div>
    <div class="banner" id="banner" hidden>
      <div class="card">
        <h2>Solved</h2>
        <p id="bannerText"></p>
        <button class="btn primary" id="next">Next level</button>
      </div>
    </div>
  </div>
</div>

<script>
const LEVELS=[
  {name:'Level 1 · Flick it in',hint:'Pinch the ball, then flick it into the basket.',ax:.3,ay:.1,rl:.32,bx:.22,by:.72,locked:false},
  {name:'Level 2 · Rope only',hint:'The ball is locked. Grab the rope weight and swing it into the ball.',ax:.16,ay:.06,rl:.44,bx:.5,by:.55,locked:true,pedestal:true}
];
const MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const TV='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const G=1900, FR=16;
const stage=document.getElementById('stage'), cvs=document.getElementById('c'), ctx=cvs.getContext('2d'), video=document.getElementById('v');
const $=id=>document.getElementById(id);
const C={}; for(const k of['ink','rope','ball','goal','hand','text','muted','line']) C[k]=getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();

let W=0,H=0,DPR=1,P=[],sticks=[],segs=[],ball,weight,anchor,basket,pedestal=null;
const st={level:0,mode:'touch',winT:0,solved:false,status:''};
const cur={x:0,y:0,px:0,py:0,tx:0,ty:0,pinch:false,was:false,present:false,grab:null,seen:0,lm:null};

function particle(x,y,r,inv,kind){const p={x,y,px:x,py:y,r,inv,kind,locked:false};P.push(p);return p}
function seg(x1,y1,x2,y2){segs.push({x1,y1,x2,y2})}
function build(){
  P=[];sticks=[];segs=[];pedestal=null;st.winT=0;st.solved=false;$('banner').hidden=true;cur.grab=null;
  const L=LEVELS[st.level], floorY=H-30;
  seg(-60,floorY,W+60,floorY);seg(0,-600,0,floorY);seg(W,-600,W,floorY);
  const bw=Math.min(140,W*.34), bh=Math.min(110,H*.17), bx=W-bw-18;
  basket={x:bx,y:floorY-bh,w:bw,h:bh,floor:floorY};
  seg(bx,floorY-bh,bx,floorY);seg(bx+bw,floorY-bh,bx+bw,floorY);
  anchor=particle(W*L.ax,H*L.ay,0,0,'anchor');
  const n=14,len=H*L.rl/n;let prev=anchor;
  for(let i=1;i<=n;i++){const last=i===n;const p=particle(anchor.x,anchor.y+i*len,last?17:5,last?.35:1,last?'weight':'rope');sticks.push({a:prev,b:p,len});prev=p}
  weight=prev;
  ball=particle(W*L.bx,H*L.by,20,1,'ball');ball.locked=L.locked;
  if(L.pedestal){const pw=64,x=ball.x-pw/2,y=ball.y+20;pedestal={x,y,w:pw,h:10,floor:floorY};
    seg(x,y,x+pw,y);seg(x+pw,y,x+pw,y+10);seg(x+pw,y+10,x,y+10);seg(x,y+10,x,y);seg(ball.x,y+10,ball.x,floorY)}
  $('hintTitle').textContent=L.name;$('hintText').textContent=L.hint+(st.status?' '+st.status:'');
  ['l0','l1'].forEach((id,i)=>$(id).setAttribute('aria-pressed',String(i===st.level)));
}
function invOf(p){return p===cur.grab?0:p.inv}
function solveStick(c){const a=c.a,b=c.b,ia=invOf(a),ib=invOf(b),w=ia+ib;if(!w)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,k=(d-c.len)/d/w;a.x+=dx*k*ia;a.y+=dy*k*ia;b.x-=dx*k*ib;b.y-=dy*k*ib}
function pushOut(p,fx,fy,R){const dx=p.x-fx,dy=p.y-fy,d=Math.hypot(dx,dy),m=p.r+R;if(d<m&&d>1e-4){p.x=fx+dx/d*m;p.y=fy+dy/d*m}}
function collide(a,b){const ia=invOf(a),ib=invOf(b),w=ia+ib;if(!w)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d<m&&d>1e-4){const k=(m-d)/d/w;a.x-=dx*k*ia;a.y-=dy*k*ia;b.x+=dx*k*ib;b.y+=dy*k*ib}}
function segCollide(p,s){
  const ex=s.x2-s.x1,ey=s.y2-s.y1,l2=ex*ex+ey*ey||1;let t=((p.x-s.x1)*ex+(p.y-s.y1)*ey)/l2;t=Math.max(0,Math.min(1,t));
  const cx=s.x1+ex*t,cy=s.y1+ey*t,dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d>=p.r||d<1e-4)return;
  const nx=dx/d,ny=dy/d;p.x=cx+nx*p.r;p.y=cy+ny*p.r;
  let vx=p.x-p.px,vy=p.y-p.py;const vn=vx*nx+vy*ny;
  if(vn<0){const tx=vx-vn*nx,ty=vy-vn*ny;vx=tx*.985-vn*nx*.35;vy=ty*.985-vn*ny*.35;p.px=p.x-vx;p.py=p.y-vy}
}
function step(dt){
  const n=8,h=dt/n;
  for(let s=1;s<=n;s++){
    const t=s/n,fx=cur.px+(cur.x-cur.px)*t,fy=cur.py+(cur.y-cur.py)*t;
    for(const p of P){
      if(p.inv===0)continue;
      if(p===cur.grab){p.px=p.x;p.py=p.y;p.x=fx;p.y=fy;continue}
      let vx=(p.x-p.px)*.999,vy=(p.y-p.py)*.999;const sp=Math.hypot(vx,vy),cap=Math.max(6,p.r*.8);if(sp>cap){vx*=cap/sp;vy*=cap/sp}
      p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+G*h*h;
    }
    for(let k=0;k<2;k++)for(const c of sticks)solveStick(c);
    if(cur.present&&!cur.grab)for(const p of P){if(p.inv&&!p.locked)pushOut(p,fx,fy,FR)}
    for(const p of P){if(p!==ball&&p.inv)collide(ball,p)}
    for(const p of P){if(p.r>0&&invOf(p))for(const g of segs)segCollide(p,g)}
  }
}
function updateGrab(){
  if(cur.pinch&&!cur.was&&cur.present){let best=null,bd=50;for(const p of P){if(!p.inv||p.locked)continue;const d=Math.hypot(p.x-cur.x,p.y-cur.y)-(p.kind==='ball'?22:p.kind==='weight'?14:0);if(d<bd){bd=d;best=p}}cur.grab=best}
  if((!cur.pinch||!cur.present)&&cur.grab)cur.grab=null;
  cur.was=cur.pinch;
}
function checkWin(dt){
  if(st.solved)return;const b=basket,inside=ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.floor;
  const slow=Math.hypot(ball.x-ball.px,ball.y-ball.py)<1.2;
  st.winT=inside&&slow&&cur.grab!==ball?st.winT+dt:0;
  if(st.winT>.5){st.solved=true;const last=st.level===LEVELS.length-1;
    $('bannerText').textContent=last?'You cleared both levels. That is the whole prototype for now.':'Nice flick. Next one takes the rope.';
    $('next').textContent=last?'Play again':'Next level';$('banner').hidden=false}
}

/* ---------- hand tracking ---------- */
let landmarker=null,lastVT=-1;
function coverMap(){const vw=video.videoWidth||640,vh=video.videoHeight||480,s=Math.max(W/vw,H/vh);return{dw:vw*s,dh:vh*s,ox:(W-vw*s)/2,oy:(H-vh*s)/2}}
function detect(now){
  if(!landmarker||video.readyState<2)return;
  if(video.currentTime===lastVT){lost(now);return}lastVT=video.currentTime;
  let res;try{res=landmarker.detectForVideo(video,now)}catch(e){return}
  const lm=res&&res.landmarks&&res.landmarks[0];
  if(!lm){lost(now);return}
  const m=coverMap(),pts=lm.map(q=>({x:W-(m.ox+q.x*m.dw),y:m.oy+q.y*m.dh}));
  const scale=Math.hypot(pts[0].x-pts[9].x,pts[0].y-pts[9].y)||1,ratio=Math.hypot(pts[4].x-pts[8].x,pts[4].y-pts[8].y)/scale;
  if(cur.pinch?ratio>.45:ratio<.3)cur.pinch=!cur.pinch;
  cur.tx=(pts[4].x+pts[8].x)/2;cur.ty=(pts[4].y+pts[8].y)/2;
  if(!cur.present){cur.x=cur.px=cur.tx;cur.y=cur.py=cur.ty}
  cur.present=true;cur.seen=now;cur.lm=pts;
}
function lost(now){if(now-cur.seen>180){cur.present=false;cur.pinch=false;cur.lm=null}}
function setStatus(s){st.status=s;$('hintText').textContent=LEVELS[st.level].hint+(s?' '+s:'')}
async function startCamera(){
  $('cam').disabled=true;setStatus('Starting camera…');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;await video.play();
  }catch(e){setStatus('The camera is blocked in this view, so touch mode stays on. Open the HTML file from an https site to use your hand.');$('cam').disabled=false;return}
  setStatus('Loading hand tracker…');
  try{
    const vision=await import(TV);const fs=await vision.FilesetResolver.forVisionTasks(TV+'/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numHands:1});
    try{landmarker=await vision.HandLandmarker.createFromOptions(fs,opts('GPU'))}catch(e){landmarker=await vision.HandLandmarker.createFromOptions(fs,opts('CPU'))}
  }catch(e){setStatus('The hand tracker could not load. Check your connection and try again.');$('cam').disabled=false;return}
  st.mode='hand';cur.present=false;$('mode').textContent='Hand';$('mode').classList.add('on');$('cam').hidden=true;
  setStatus('Prop your phone up. Pinch thumb and index to grab. Open your hand to let go.');
}

/* ---------- touch ---------- */
function pt(e){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cvs.addEventListener('pointerdown',e=>{if(st.mode!=='touch')return;cvs.setPointerCapture(e.pointerId);const q=pt(e);cur.tx=cur.x=cur.px=q.x;cur.ty=cur.y=cur.py=q.y;cur.present=true;cur.pinch=true});
cvs.addEventListener('pointermove',e=>{if(st.mode!=='touch'||!cur.present)return;const q=pt(e);cur.tx=q.x;cur.ty=q.y});
const up=()=>{if(st.mode!=='touch')return;cur.pinch=false;cur.present=false};
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);

/* ---------- drawing ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  if(st.mode==='hand'&&video.readyState>=2){const m=coverMap();ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,m.ox,m.oy,m.dw,m.dh);ctx.restore();ctx.fillStyle='rgba(14,21,36,.58)';ctx.fillRect(0,0,W,H)}
  else{ctx.fillStyle='rgba(151,163,189,.14)';for(let x=12;x<W;x+=24)for(let y=12;y<H;y+=24)ctx.fillRect(x,y,1.5,1.5)}
  const b=basket;
  ctx.fillStyle='rgba(88,210,166,.14)';ctx.fillRect(b.x,b.y,b.w,b.floor-b.y);
  ctx.strokeStyle=C.goal;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.floor);ctx.lineTo(b.x+b.w,b.floor);ctx.lineTo(b.x+b.w,b.y);ctx.stroke();
  ctx.fillStyle=C.goal;ctx.font='500 11px '+getComputedStyle(document.body).getPropertyValue('--mono');ctx.fillText('GOAL',b.x+8,b.y+16);
  ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,b.floor);ctx.lineTo(W,b.floor);ctx.stroke();
  if(pedestal){ctx.fillStyle=C.line;ctx.fillRect(pedestal.x,pedestal.y,pedestal.w,pedestal.h);ctx.fillRect(ball.x-2,pedestal.y+pedestal.h,4,pedestal.floor-pedestal.y-pedestal.h)}
  ctx.strokeStyle=C.rope;ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(anchor.x,anchor.y);for(const c of sticks)ctx.lineTo(c.b.x,c.b.y);ctx.stroke();
  ctx.fillStyle=C.text;ctx.beginPath();ctx.arc(anchor.x,anchor.y,6,0,7);ctx.fill();
  ctx.fillStyle=C.rope;ctx.beginPath();ctx.arc(weight.x,weight.y,weight.r,0,7);ctx.fill();ctx.strokeStyle='rgba(14,21,36,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(weight.x,weight.y,weight.r-5,0,7);ctx.stroke();
  ctx.fillStyle=C.ball;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(ball.x-6,ball.y-7,6,0,7);ctx.fill();
  if(ball.locked){ctx.setLineDash([5,5]);ctx.strokeStyle=C.text;ctx.lineWidth=2;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+6,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.ink;ctx.fillRect(ball.x-6,ball.y-2,12,9);ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(ball.x,ball.y-3,4,Math.PI,0);ctx.stroke()}
  if(cur.lm){const L=cur.lm,B=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
    ctx.strokeStyle='rgba(143,208,255,.45)';ctx.lineWidth=2;ctx.beginPath();for(const[a,c]of B){ctx.moveTo(L[a].x,L[a].y);ctx.lineTo(L[c].x,L[c].y)}ctx.stroke();
    ctx.fillStyle=C.hand;for(const q of L){ctx.beginPath();ctx.arc(q.x,q.y,2.5,0,7);ctx.fill()}}
  if(cur.present){ctx.strokeStyle=C.hand;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cur.x,cur.y,FR,0,7);ctx.stroke();
    if(cur.pinch){ctx.fillStyle=cur.grab?C.hand:'rgba(143,208,255,.35)';ctx.beginPath();ctx.arc(cur.x,cur.y,cur.grab?7:FR-3,0,7);ctx.fill()}}
}

/* ---------- loop + wiring ---------- */
function resize(){const r=stage.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);DPR=Math.min(2,window.devicePixelRatio||1);cvs.width=W*DPR;cvs.height=H*DPR;build()}
new ResizeObserver(resize).observe(stage);resize();
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,Math.max(1/240,(now-last)/1000));last=now;
  if(st.mode==='hand')detect(now);
  cur.px=cur.x;cur.py=cur.y;
  if(cur.present){const a=st.mode==='hand'?.55:1;cur.x+=(cur.tx-cur.x)*a;cur.y+=(cur.ty-cur.y)*a}
  updateGrab();step(dt);checkWin(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$('l0').onclick=()=>{st.level=0;build()};$('l1').onclick=()=>{st.level=1;build()};
$('reset').onclick=build;$('cam').onclick=startCamera;
$('next').onclick=()=>{st.level=(st.level+1)%LEVELS.length;build()};
</script>
